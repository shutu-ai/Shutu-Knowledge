name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Download Go modules
        run: go mod download
      - name: "Architecture gate: no shutu-agent internal imports"
        run: |
          if grep -RIn --include='*.go' 'shutu-agent/internal' cmd internal; then
            echo '::error::production imports of shutu-agent/internal are forbidden'
            exit 1
          fi
      - name: "Architecture gate: public SDK imports stay in internal/extension"
        run: |
          matches=$(grep -RIl --include='*.go' 'github.com/shutu-ai/shutu-agent/sdk/extension' cmd internal | grep -v '^internal/extension/' || true)
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo '::error::only internal/extension may import shutu-agent/sdk/extension'
            exit 1
          fi
      - name: "Portability gate: no local Agent replacement"
        run: |
          if grep -En 'replace[[:space:]]+github\.com/shutu-ai/shutu-agent|(/|[A-Za-z]:\\\\)dev-projects/' go.mod; then
            echo '::error::go.mod must resolve the public shutu-agent module'
            exit 1
          fi
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Web typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web test
        working-directory: web
        run: npm test
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

      - name: Check storage writer guard
        run: go test ./scripts -run '^TestWriterGuard$' -count=1
      - name: Test race
        run: go test -race ./... -p 1 -timeout=30m
      - name: Benchmark smoke
        run: go test ./internal/knowledge -run '^$' -bench Benchmark -benchtime=1x
      - name: Browser E2E
        working-directory: web
        run: npm run test:e2e
        env:
          SHUTU_KNOWLEDGE_BROWSER: google-chrome

  # The ordinary build job is intentionally hermetic and does not download
  # multi-gigabyte model weights. Release tags and an explicit manual run
  # execute the real managed-runtime contract on Linux as well.
  runtime-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Real managed runtime smoke
        run: go run ./scripts/runtime_smoke.go -home "$RUNNER_TEMP/shutu-runtime-home" -model-cache "$RUNNER_TEMP/shutu-runtime-model-cache"
      - name: Offline managed runtime restart smoke
        run: go run ./scripts/runtime_smoke.go -home "$RUNNER_TEMP/shutu-runtime-home" -model-cache "$RUNNER_TEMP/shutu-runtime-model-cache" -offline-restart

  # Native lifecycle evidence is intentionally separate from the ordinary
  # Ubuntu build: instance ownership, signal handling, and process-tree
  # cleanup must execute on each supported release host.
  release-host:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: release-host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Native host lifecycle acceptance
        run: go run ./cmd/release-acceptance -profile host
      - name: Upload release-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-host-${{ matrix.os }}
          path: .tmp/release-acceptance
          if-no-files-found: warn

  # Formal packaging is a separate gate from native lifecycle acceptance. The
  # package script requires the checkout to be clean, embeds the candidate
  # identity and storage contract, verifies the archive, and runs the static
  # secret/provenance audit before an artifact can be uploaded.
  release-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Build, verify, and audit formal package
        shell: pwsh
        run: |
          & .\scripts\package_release.ps1 `
            -Platform windows-amd64 `
            -OutputRoot .tmp\formal-release
      - name: Upload formal package and audit inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-release-windows-amd64
          path: .tmp/formal-release
          if-no-files-found: warn
