<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shutu Knowledge</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app" aria-busy="true">
    <aside class="sidebar">
      <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true"></span>Shutu Knowledge</a>
      <nav id="navigation" class="nav" aria-label="Knowledge"></nav>
      <label class="field language-field">
        <span>Language</span>
        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1 id="page-title">Overview</h1><p id="page-subtitle">Knowledge service status</p></div>
        <div id="top-actions" class="top-actions"></div>
      </header>
      <div id="screen" class="screen"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/api.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
